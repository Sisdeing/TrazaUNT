const embebido=new URLSearchParams(location.search).get('embebido')==='1';if(embebido)document.body.classList.add('embebido');const root=document.querySelector('#app'),msg=document.querySelector('#msg'),modal=document.querySelector('#modal');if(embebido){/* Dentro de la aplicación el marco es tan alto como su contenido: la ventana se ubica en la parte visible de la pantalla, no en el centro del marco. */const abrirVentana=modal.showModal.bind(modal);modal.showModal=()=>{abrirVentana();try{const r=frameElement.getBoundingClientRect(),visible=Math.max(0,-r.top),disponible=parent.innerHeight-Math.max(0,r.top);Object.assign(modal.style,{position:'fixed',top:(visible+24)+'px',bottom:'auto',left:'0',right:'0',margin:'0 auto',maxHeight:Math.max(320,disponible-48)+'px',overflow:'auto'})}catch(e){}}}let user,items=[],exp,phaseId,tab='Fases',filter='',originFilter='',yearFilter='',page=1,historico={};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=x=>esc(String(x??'').replaceAll('_',' '));const date=x=>x?new Date(x).toLocaleString('es-PE',{timeZone:'America/Lima'}):'—';const tag=(x,c='')=>`<span class="tag ${c}">${pretty(x)}</span>`;const writable=()=>['administrador','analista'].includes(user?.rol);const act=(name,label)=>`<button data-act="${name}">${label}</button>`;const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${heads.length}">Sin registros.</td></tr>`}</tbody></table></div>`;const tr=(...a)=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`;const phase=()=>exp.fases.find(f=>f.id===phaseId)||exp.fases[0];
async function api(path,opt={}){let headers={'X-Traza-Client':'react'};if(opt.body&&!(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch('/api'+path,{...opt,headers});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(typeof e.detail==='string'?e.detail:'Verifica los campos de la operación.')}return r.json()}
function err(e){msg.className='error';msg.textContent=e.message;window.scrollTo(0,0)}function clear(){msg.textContent='';msg.className=''}async function list(){clear();exp=null;[items,historico]=await Promise.all([api('/trazabilidad').then(x=>x.items),api('/trazabilidad/historico')]);page=1;renderList()}async function open(id){clear();exp=await api('/trazabilidad/'+id);phaseId=exp.fases[0].id;tab=origin(exp)==='publico'?'Resumen':'Fases';render()}
const origin=e=>e.datos?.origen==='publico'?'publico':e.datos?.sintetico?'demo':'local';const originLabel=e=>origin(e)==='publico'?'<span class="tag origin-public">Fuente pública</span>':origin(e)==='demo'?'<span class="tag origin-demo">Demostración</span>':'<span class="tag">Registro local</span>';const money=v=>v===''||v==null?'No disponible':new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(Number(v));const safeUrl=v=>{try{let u=new URL(v);return u.protocol==='https:'?esc(u.href):''}catch{return ''}};const links=(sources=[])=>`<ul>${sources.filter(x=>safeUrl(x.url)||x.archivo).map(x=>safeUrl(x.url)?`<li><a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.titulo)}</a> <small>· ${esc(x.tipo)}</small></li>`:`<li class="fuente-local">${esc(x.titulo)} <small>· ${esc(x.tipo)} · archivo entregado</small></li>`).join('')}</ul>`;const cidBlock=e=>{let c=e.datos?.cid;if(!c)return '';let evs=(e.eventos||[]).filter(v=>v.accion==='asiento_cid');return `<details class="cid-box" open><summary><b>Cuaderno de Obra Digital (CID)</b> · ${c.asientos} asientos · contrato ${esc(c.contrato)}</summary><p><b>Contrato:</b> ${esc(c.numero_contrato)} · <b>Contratista:</b> ${esc(c.contratista)} · <b>Monto:</b> ${money(c.monto)}</p><p><b>Primer asiento:</b> ${esc(c.primer_asiento)} · <b>Último asiento:</b> ${esc(c.ultimo_asiento)} · <b>Vigencia publicada hasta:</b> ${esc(c.vigencia_final||'—')} · <b>Estado de obra:</b> ${esc(c.estado_obra||'—')}</p><p class="subtle"><b>Procedencia:</b> ${esc(c.conjunto)} · ${esc(c.archivo)}. Vinculado por código de contrato exacto. Cada asiento conserva su archivo y fila.</p><ol>${evs.map(v=>`<li><b>${esc(v.efectiva?.slice(0,10))}</b> · ${esc(v.datos.titulo)}<br><small>${esc(v.datos.archivo)} · ${esc(v.datos.hoja)} · fila ${esc(v.datos.fila)}</small><details><summary>Texto del asiento</summary><p>${esc(v.datos.descripcion)}</p></details></li>`).join('')}</ol></details>`};function publicInfo(e){let r=e.datos?.registro_publico;if(!r)return '';let ai=r.analisis_historico;return `<div class="source-card"><div class="row between"><h3>Información publicada</h3>${tag('Fuente pública','origin-public')}</div><p><b>Procedimiento:</b> ${esc(r.id_fuente)}${r.codigo_convocatoria?` · Código SEACE ${esc(r.codigo_convocatoria)}`:''} ${r.modalidad?` · ${esc(r.modalidad)}`:''}</p><p><b>Valor referencial:</b> ${money(e.monto)}${r.moneda&&r.moneda!=='PEN'?` · Valor original ${esc(r.valor_original)} ${esc(r.moneda)}`:''}</p><p><b>Proveedores:</b> ${esc(r.proveedores?.join(', ')||'No incorporados en la fuente consultada')}</p>${ai?`<div class="ai-box"><b>Atipicidad histórica · Isolation Forest</b><div class="row between"><strong>${ai.percentil_atipicidad} percentil</strong>${tag(ai.senal?'Revisión estadística sugerida':'Sin señal del modelo',ai.senal?'warn':'')}</div><progress max="100" value="${ai.percentil_atipicidad}"></progress><small>Comparación con ${esc(ai.categoria)} · ${esc(ai.conjunto)} · No acredita irregularidad.</small></div>`:''}<details><summary>Participantes (${r.postores?.length||0}) y comité (${r.comite?.length||0})</summary>${table(['Identificador','Postor publicado'],(r.postores||[]).map(q=>tr(esc(q.id),esc(q.nombre))))}<p><b>Miembros de comité publicados:</b> ${esc(r.comite?.join(', ')||'Sin datos vinculados')}</p></details><details><summary>Padrón de proveedores vinculado (${e.padron_publicado?.length||0} filas)</summary>${table(['RUC / proveedor','Registro','Vigencia publicada','Origen'],(e.padron_publicado||[]).map(x=>tr(esc(x.datos['RUC PROVEEDOR'])+'<br>'+esc(x.datos.PROVEEDOR),esc(x.datos.REGISTRO),esc(x.datos.D_FEC_INICIOVIGENCIA||'—')+' a '+esc(x.datos.D_FEC_FINVIGENCIA||'—'),esc(x.archivo)+' · fila '+x.fila)))}</details><details><summary>Contratos publicados (${r.contratos_publicados?.length||0})</summary>${table(['Contrato','Valor y moneda','Firma'],(r.contratos_publicados||[]).map(c=>tr(esc(c.title||c.id),esc(c.value?.amount??'No informado')+' '+esc(c.value?.currency),esc(c.dateSigned||'No informado'))))}</details>${cidBlock(e)}<details><summary>Documentos y fuentes (${r.fuentes?.length||0})</summary>${links(r.fuentes)}</details><details><summary>Filas originales de fuentes complementarias (${r.registros_complementarios?.length||0})</summary>${(r.registros_complementarios||[]).map(x=>`<details><summary>${esc(x.archivo)} · fila ${x.fila}</summary><pre>${esc(JSON.stringify(x.datos,null,2))}</pre></details>`).join('')}</details><p class="subtle">La fuente pública no acredita conformidades, pagos ni verificaciones internas. Los controles no documentados permanecen sin verificar.</p></div>`}
function historialCard(){let a=historico.ia||{};if(!a.procedimientos_ocds)return '';return `<details class="panel archive"><summary><b>Inteligencia histórica · Datos oficiales</b> <small>Ver cobertura y evaluación del modelo</small></summary><div class="cards"><div class="stat"><small>Procedimientos OCDS</small><strong>${a.procedimientos_ocds.toLocaleString('es-PE')}</strong></div><div class="stat"><small>Entidades universitarias</small><strong>${a.universidades}</strong></div><div class="stat"><small>UNT con puntuación</small><strong>${a.unt_con_puntuacion}</strong></div><div class="stat"><small>Señales estadísticas UNT</small><strong>${a.unt_senales}</strong></div></div><h3>Isolation Forest · evaluación temporal</h3>${table(['Categoría','Entrenamiento 2020–23','Evaluación 2024','Señales 2024'],Object.entries(a.modelos||{}).map(([k,v])=>tr(pretty(k),v.entrenamiento,v.evaluacion_temporal,v.senales_2024+' ('+v.tasa_senales_2024+'%)')))}<p class="muted">${esc(a.advertencia)}</p><details><summary>Cobertura por archivo de origen</summary>${table(['Archivo','Filas examinadas','Universidades / vinculadas a UNT'],[...Object.entries(historico.ocds||{}).map(([k,v])=>tr(esc(k),v.lineas,v.universidades+' / '+v.unt)),...Object.entries(historico.complementarios||{}).map(([k,v])=>tr(esc(k),v.filas,v.vinculadas_unt))])}</details></details>`}
function renderList(){let filtered=items.filter(e=>(e.codigo+' '+e.nombre+' '+e.area+' '+(e.datos?.registro_publico?.id_fuente||'')+' '+(e.datos?.registro_publico?.codigo_convocatoria||'')).toLowerCase().includes(filter.toLowerCase())&&(!originFilter||origin(e)===originFilter)&&(!yearFilter||e.inicio?.slice(0,4)===yearFilter));let pages=Math.max(1,Math.ceil(filtered.length/20));page=Math.min(page,pages);let years=[...new Set(items.map(e=>e.inicio?.slice(0,4)).filter(Boolean))].sort().reverse();root.innerHTML=`<div class="row between"><div><small class="titulo-pagina">GESTIÓN INSTITUCIONAL / EXPEDIENTES</small><h1 class="titulo-pagina">Expedientes y trazabilidad</h1><p class="muted">Consulta procedimientos publicados, verifica controles y registra actuaciones.</p></div>${writable()?'<button class="primary" data-act="new">+ Nuevo expediente</button>':''}</div><div class="cards">${[['Expedientes',items.length],['Fuentes públicas',items.filter(e=>origin(e)==='publico').length],['Demostraciones',items.filter(e=>origin(e)==='demo').length],['Registros locales',items.filter(e=>origin(e)==='local').length],['Alertas por revisar',items.reduce((a,e)=>a+e.alertas,0)]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div>${historialCard()}<section class="panel"><div class="row between"><h2>Bandeja de expedientes</h2><div class="filters"><select id="origin" aria-label="Procedencia"><option value="">Toda procedencia</option><option value="publico" ${originFilter==='publico'?'selected':''}>Fuentes públicas</option><option value="demo" ${originFilter==='demo'?'selected':''}>Demostraciones</option><option value="local" ${originFilter==='local'?'selected':''}>Registros locales</option></select><select id="year" aria-label="Año"><option value="">Todos los años</option>${years.map(y=>`<option value="${esc(y)}" ${yearFilter===y?'selected':''}>${esc(y)}</option>`).join('')}</select><input style="max-width:310px" id="search" placeholder="Buscar código o nombre" value="${esc(filter)}"></div></div>${table(['Código / expediente','Procedencia','Tipo / año','Controles locales','Alertas',''],filtered.slice((page-1)*20,page*20).map(e=>tr(`<b>${esc(e.codigo)}</b><br>${esc(e.nombre)}${origin(e)==='publico'?`<br><small>${esc(e.datos.registro_publico.id_fuente)}</small>`:''}`,originLabel(e),pretty(e.tipo)+'<br><small>'+esc(e.inicio?.slice(0,4)||'Sin fecha')+'</small>',`<progress max="100" value="${e.avance}"></progress>${e.avance}%`,tag(e.alertas,e.alertas?'warn':''),`<button data-open="${e.id}">Abrir →</button>`)))}<div class="row between pager"><small>${filtered.length} resultados · Página ${page} de ${pages}</small><div class="row"><button data-page="${page-1}" ${page===1?'disabled':''}>Anterior</button><button data-page="${page+1}" ${page===pages?'disabled':''}>Siguiente</button></div></div></section><p class="muted">Las demostraciones incluyen actuaciones ficticias. Los registros públicos no acreditan todas las fases. Otros módulos históricos de la aplicación conservan sus datos de demostración.</p>`;document.querySelector('#origin').addEventListener('change',e=>{originFilter=e.target.value;page=1;renderList()});document.querySelector('#year').addEventListener('change',e=>{yearFilter=e.target.value;page=1;renderList()});document.querySelector('#search').addEventListener('input',e=>{filter=e.target.value;page=1;renderList();let n=document.querySelector('#search');n.focus();n.setSelectionRange(filter.length,filter.length)})}
function reqTable(f){return table(['Requisito','Estado','Última versión'],f.requisitos.map(q=>{let ds=f.documentos.filter(d=>d.requisito_id===q.id);let d=ds.at(-1);return tr(esc(q.nombre),tag(q.estado,q.estado==='validado'?'ok':''),d?`<a href="/api/trazabilidad/${exp.id}/documentos/${d.id}">${esc(d.nombre)} · v${d.version}</a>`:'No cargado')}))}
function docTable(fs){return table(['Fase / documento','Versión','Autor / registro','Estado','Integridad'],fs.flatMap(f=>f.documentos.map(d=>tr(`${esc(f.nombre)}<br><a href="/api/trazabilidad/${exp.id}/documentos/${d.id}">${esc(d.nombre)}</a>`,d.version,`${esc(d.autor)}<br>${esc(d.registrado_por)}`,tag(d.estado),`<small title="${esc(d.sha256)}">${esc(d.sha256.slice(0,16))}…</small>`))))}
function obsTable(fs){return table(['Observación','Responsable','Plazo','Estado','Respuestas'],fs.flatMap(f=>f.observaciones.map(o=>tr(`<b>OBS-${o.id} · ${esc(f.nombre)}</b><br>${esc(o.descripcion)}`,`${esc(o.responsable)}<br><small>Observó: ${esc(o.autor)}</small>`,esc(o.limite),tag(o.estado,o.estado==='cerrada'?'ok':'warn'),o.respuestas.map(r=>`<p>${pretty(r.accion)} · ${esc(r.actor)}<br>${esc(r.texto)}</p>`).join('')||'—'))))}
function timeline(events){return `<div class="timeline">${events.slice().reverse().map(e=>`<div class="event"><small>${date(e.fecha)} · EVT-${e.id}${e.efectiva!==e.fecha?` · Fecha efectiva: ${esc(e.efectiva)}`:""}</small><br><b>${esc(e.datos.actividad)||pretty(e.accion)}</b> · ${esc(e.actor)}<br><small>Responsable documentado: ${esc(e.responsable)}</small>${e.datos.justificacion?`<p>${esc(e.datos.justificacion)}</p>`:''}<details><summary>Datos del evento</summary><pre>${esc(JSON.stringify(e.datos,null,2))}</pre><small>Hash: ${esc(e.hash)}</small></details></div>`).join('')}</div>`}
function alerts(){return table(['Regla / señal','Fase detectada','Posible origen','Estado',''],exp.alertas.map(a=>tr(`<b>${esc(a.regla)}</b><br>${esc(a.descripcion)}`,esc(exp.fases.find(f=>f.id===a.fase_id)?.nombre),esc(exp.fases.find(f=>f.id===a.evidencia.origen_fase_id)?.nombre),tag(a.vigente?a.estado:'no vigente',a.vigente?'warn':''),`<button data-incident="${a.id}">Reconstruir incidente</button>`)))}
function render(){let f=phase(),total=exp.fases.reduce((a,f)=>a+f.requisitos.length,0),validated=exp.fases.reduce((a,f)=>a+f.requisitos.filter(q=>q.estado==='validado').length,0),cnt=exp.alertas.filter(a=>a.vigente&&a.estado==='pendiente').length;let content='';if(tab==='Fases')content=`<div class="cards">${exp.fases.map((x,i)=>`<button class="phase ${esc(x.estado)} ${x.id===f.id?'selected':''}" data-phase="${x.id}"><small>${String(i+1).padStart(2,'0')} · ${esc(x.codigo)}</small><h3>${esc(x.nombre)}</h3><div class="stage-meta">${tag(origin(exp)==='publico'&&x.estado==='pendiente'?'Sin verificar':x.estado)} <small>${x.avance}%</small></div><progress max="100" value="${x.avance}"></progress></button>`).join('')}</div><section class="panel"><div class="row between"><div><small>${esc(f.codigo)}</small><h2>${esc(f.nombre)}</h2></div>${tag(f.estado)}</div><p>Responsable: <b>${esc(f.responsable)}</b> · Plazo: ${esc(f.limite||"No documentado")} · Requisitos validados: ${f.avance}%</p>${writable()?`<div class="row no-print">${['iniciar','verificar','observar','subsanar','cerrar_observacion','visto_bueno','cerrar','reabrir','asignar',...(f.orden===7?['pago']:[])].map(a=>act(a,({'cerrar_observacion':'Verificar subsanación','visto_bueno':'Visto bueno','pago':'Registrar pago','asignar':'Asignar responsable'})[a]||pretty(a))).join('')}${act('upload','+ Cargar documento')}</div>`:''}${origin(exp)==='publico'?`<div class="source-card"><b>Hitos publicados de esta fase</b>${exp.eventos.filter(e=>e.fase_id===f.id&&e.accion==='hecho_publicado').map(e=>`<p>${esc(e.efectiva)} · ${esc(e.datos.actividad)}</p>`).join('')||'<p>No se incorporaron hitos de esta fase.</p>'}${links((exp.datos.registro_publico.fuentes||[]).filter(x=>x.fase===f.orden))}</div>`:''}<h3>Requisitos y controles</h3>${reqTable(f)}<h3>Documentos y versiones</h3>${docTable([f])}<h3>Observaciones y subsanaciones</h3>${obsTable([f])}<h3>Actuaciones de la fase</h3>${timeline(exp.eventos.filter(e=>e.fase_id===f.id))}</section>`;else if(tab==='Documentos')content=`<section class="panel">${docTable(exp.fases)}</section>`;else if(tab==='Responsables')content=`<section class="panel">${table(['Fase','Responsable asignado','Actuaciones registradas'],exp.fases.map(f=>tr(esc(f.nombre),esc(f.responsable),exp.eventos.filter(e=>e.fase_id===f.id).map(e=>`${pretty(e.accion)}: <span class="person">${esc(e.responsable)}</span> <small>(${esc(e.actor)})</small>`).join('<br>'))))}</section>`;else if(tab==='Observaciones')content=`<section class="panel">${obsTable(exp.fases)}</section>`;else if(tab==='Alertas')content=`<section class="panel">${alerts()}</section>`;else if(tab==='Historial')content=`<section class="panel">${timeline(exp.eventos)}</section>`;else if(tab==='Proceso')content=`<section class="panel"><h2>Sucesión observada de actividades</h2><p>${esc(exp.mineria.metodo)}</p>${table(['Desde','Hasta','Frecuencia'],exp.mineria.transiciones.map(t=>tr(pretty(t.desde),pretty(t.hasta),t.frecuencia)))}</section>`;else if(tab==='Informe')content=`<section class="panel"><h2>Informe integral de trazabilidad</h2>${originLabel(exp)}${publicInfo(exp)}<p>${esc(exp.codigo)} · ${esc(exp.objeto)}<br>Generado: ${date(new Date().toISOString())} · Reglas TZ 1.0</p>${exp.fases.map(f=>`<h3>${esc(f.codigo)} · ${esc(f.nombre)}</h3><p>${tag(f.estado)} · ${esc(f.responsable)}</p>${reqTable(f)}${docTable([f])}${obsTable([f])}`).join('')}<h3>Alertas</h3>${alerts()}<h3>Cronología</h3>${timeline(exp.eventos)}<p>Revisión humana obligatoria. Los indicios no acreditan culpabilidad.</p></section>`;else content=`<section class="panel"><h2>Datos generales</h2>${publicInfo(exp)}<p>${esc(exp.objeto)}</p><p>Área: ${esc(exp.area)} · Responsable: ${esc(exp.responsable)} · Inicio: ${esc(exp.inicio)} · Monto: ${money(exp.monto)}</p><p>Plantilla: ${esc(exp.tipo)} v${exp.plantilla.version}</p>${['contratacion_id','convocatoria_id','concesion_id','proveedor_id'].filter(k=>exp[k]).map(k=>`<p>${pretty(k)}: ${esc(exp[k])}</p>`).join('')}</section>`;
root.innerHTML=`<div class="row between"><button data-act="back">← Expedientes</button><div class="row">${writable()?'<button class="primary" data-act="scan">Analizar expediente</button>':''}<button data-act="print">Imprimir informe</button></div></div><section class="panel hero"><div class="row between"><small>${esc(exp.codigo)} · ${pretty(exp.tipo)}</small>${originLabel(exp)}</div><h1>${esc(exp.nombre)}</h1><p class="muted">${esc(exp.area)} · ${esc(exp.responsable)}</p><div class="cards"><div><small>Fases cerradas localmente</small><h2>${exp.fases.filter(f=>f.estado==='cerrada').length} / ${exp.fases.length}</h2></div><div><small>Requisitos validados</small><h2>${validated} / ${total}</h2></div><div><small>Alertas por revisar</small><h2>${cnt}</h2></div></div></section>${origin(exp)==='publico'&&['Documentos','Responsables'].includes(tab)?publicInfo(exp):''}<div class="tabs">${['Resumen','Fases','Documentos','Responsables','Observaciones','Alertas','Historial','Proceso','Informe'].map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}">${t}</button>`).join('')}</div>${content}`}
const field=(name,label,type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" ${extra}></label>`;const select=(name,label,opts)=>`<label>${label}<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;const txt=(name,label)=>`<label>${label}<textarea name="${name}" required rows="3"></textarea></label>`;function form(title,body,submit){modal.innerHTML=`<form id="operation"><div class="row between"><h2>${title}</h2><button type="button" id="cancel">Cerrar</button></div><div class="formgrid">${body}</div><p id="formerror" role="alert"></p><button class="primary" type="submit">Guardar</button></form>`;modal.showModal();modal.querySelector('#cancel').onclick=()=>modal.close();modal.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await submit(new FormData(e.target));modal.close();clear()}catch(ex){modal.querySelector('#formerror').textContent=ex.message}finally{b.disabled=false}}}
function newForm(){form('Nuevo expediente',field('nombre','Nombre','text','required')+field('objeto','Objeto','text','required')+field('area','Área solicitante','text','required')+field('responsable','Responsable principal','text','required')+select('tipo','Plantilla',[['servicios','Contratación de servicios'],['bienes','Adquisición de bienes'],['obras','Obras'],['otros','Otro procedimiento'],['concesion','Concesión']])+field('inicio','Fecha de inicio','date','required')+field('monto','Monto referencial (S/)','number','min="0" step="0.01" required')+field('contratacion_id','ID contratación (opcional)','number','min="1"')+field('convocatoria_id','ID convocatoria (opcional)','number','min="1"')+field('concesion_id','ID concesión (opcional)','number','min="1"')+field('proveedor_id','ID proveedor (opcional)','number','min="1"'),async fd=>{let d=Object.fromEntries(fd);for(let k of ['contratacion_id','convocatoria_id','concesion_id','proveedor_id'])d[k]=d[k]?Number(d[k]):null;let e=await api('/trazabilidad',{method:'POST',body:d});await open(e.id)})}
function actionForm(a){let f=phase(),opts=[['','Sin seleccionar'],...f.requisitos.map(q=>[q.id,q.nombre])],docs=[['','Sin seleccionar'],...f.documentos.map(d=>[d.id,`${d.nombre} · v${d.version} · req ${d.requisito_id}`])],obs=[['','Sin seleccionar'],...f.observaciones.map(o=>[o.id,`OBS-${o.id}: ${o.descripcion}`])];if(a==='upload'){form('Cargar documento',select('requisito_id','Requisito',opts.slice(1))+field('autor','Autor declarado','text','required')+field('archivo','Archivo (PDF, DOCX, XLSX, CSV, TXT)','file','required accept=".pdf,.docx,.xlsx,.csv,.txt"'),async fd=>{exp=await api(`/trazabilidad/${exp.id}/fases/${f.id}/documentos`,{method:'POST',body:fd});render()});return}let body=txt('justificacion','Motivo / evidencia de la actuación');if(['verificar','observar'].includes(a))body+=select('requisito_id','Requisito',opts)+select('documento_id','Documento / versión',docs);if(['subsanar','cerrar_observacion'].includes(a))body+=select('observacion_id','Observación',obs)+select('documento_id','Evidencia de subsanación',docs);if(['asignar','observar'].includes(a))body+=field('responsable','Responsable documentado','text','required')+field('limite','Fecha límite','date',a==='observar'?'required':'');if(a==='observar')body+=select('severidad','Severidad',[['baja','Baja'],['media','Media'],['alta','Alta']]);if(a==='pago')body+=field('monto_autorizado','Monto autorizado','number','min="0" step="0.01" required')+field('monto_pagado','Monto efectivamente pagado','number','min="0" step="0.01" required');form(pretty(a),body,async fd=>{let d=Object.fromEntries(fd);for(let k of ['requisito_id','documento_id','observacion_id','limite'])if(d[k]==='')delete d[k];exp=await api(`/trazabilidad/${exp.id}/fases/${f.id}/accion`,{method:'POST',body:{...d,accion:a,revision:f.revision}});render()})}
async function incident(id){let d=await api(`/trazabilidad/${exp.id}/alertas/${id}/incidente`);modal.innerHTML=`<div class="row between"><h2>Reconstrucción de incidente</h2><button id="cancel">Cerrar</button></div><p>${esc(d.alerta.regla)} · ${esc(d.alerta.descripcion)}</p><p><b>Detección:</b> ${esc(exp.fases.find(f=>f.id===d.alerta.fase_id)?.nombre)}<br><b>Posible origen:</b> ${esc(exp.fases.find(f=>f.id===d.alerta.evidencia.origen_fase_id)?.nombre)}</p>${obsTable(d.fases)}${docTable(d.fases)}<h3>Eventos relacionados</h3>${timeline(d.eventos)}<p>Etapas potencialmente afectadas: ${esc(d.posteriores.join(', '))}</p><p>${esc(d.recomendacion)}</p>${writable()?'<div class="row"><button id="review">Registrar revisión</button></div>':''}`;modal.showModal();modal.querySelector('#cancel').onclick=()=>modal.close();let r=modal.querySelector('#review');if(r)r.onclick=()=>{modal.close();form('Revisión humana',select('accion','Decisión',[['revisada','Revisada'],['descartada','Descartada']])+txt('justificacion','Sustento'),async fd=>{exp=await api(`/trazabilidad/${exp.id}/alertas/${id}/revision`,{method:'POST',body:{...Object.fromEntries(fd),revision:0}});render()})}}
root.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;clear();try{let d=b.dataset;if(d.page){page=Number(d.page);renderList()}else if(d.open)await open(Number(d.open));else if(d.phase){phaseId=Number(d.phase);render()}else if(d.tab){tab=d.tab;render()}else if(d.incident)await incident(d.incident);else if(d.act==='back')await list();else if(d.act==='new')newForm();else if(d.act==='scan'){exp=await api(`/trazabilidad/${exp.id}/analizar`,{method:'POST'});tab='Alertas';render()}else if(d.act==='print'){tab='Informe';render();window.print()}else if(d.act)actionForm(d.act)}catch(ex){err(ex)}});(async()=>{try{user=(await api('/sesion')).usuario;if(!user){root.innerHTML='<section class="panel"><h1>Inicia sesión</h1><a class="btn" href="/#avisos">Ir al acceso de TrazaUNT</a></section>';return}await list();let inicial=new URLSearchParams(location.search).get('expediente');if(inicial&&/^\d+$/.test(inicial))await open(Number(inicial))}catch(e){err(e);root.innerHTML='<a class="btn" href="/" target="_top">Volver a TrazaUNT</a>'}})();
</script></body></html>
